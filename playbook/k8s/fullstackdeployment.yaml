# =========================
# MySQL PVC
# =========================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# =========================
# MySQL Deployment
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_DATABASE
              value: foodrecipe
            - name: MYSQL_ROOT_PASSWORD
              value: root
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc

---
# =========================
# MySQL Service (ClusterIP)
# =========================
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  type: ClusterIP

---
# =========================
# Backend Deployment
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshfork-backend
  labels:
    app: freshfork-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: freshfork-backend
  template:
    metadata:
      labels:
        app: freshfork-backend
    spec:
      # Wait for MySQL to be ready before starting backend
      initContainers:
        - name: wait-for-mysql
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for mysql on mysql:3306..."
              until nc -z -w 3 mysql 3306; do
                echo "$(date) - mysql not ready, sleeping 2s"
                sleep 2
              done
              echo "mysql is reachable"
      containers:
        - name: backend
          image: tejahaha/freshfork-backend:v6
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/foodrecipe?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SERVER_PORT
              value: "8083"
          # readiness probe ensures service only routes when port listening
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10

---
# =========================
# Backend Service (NodePort)
# =========================
apiVersion: v1
kind: Service
metadata:
  name: freshfork-backend
spec:
  type: NodePort
  selector:
    app: freshfork-backend
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083

---
# =========================
# Frontend Deployment
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshfork-frontend
  labels:
    app: freshfork-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: freshfork-frontend
  template:
    metadata:
      labels:
        app: freshfork-frontend
    spec:
      containers:
        - name: frontend
          image: tejahaha/freshfork-frontend:v12
          ports:
            - containerPort: 80

---
# =========================
# Frontend Service (NodePort)
# =========================
apiVersion: v1
kind: Service
metadata:
  name: freshfork-frontend
spec:
  type: NodePort
  selector:
    app: freshfork-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082