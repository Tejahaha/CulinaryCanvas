server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve frontend routes (React, Vue, etc.)
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to backend running on localhost:8083
    location /api/ {
        proxy_pass http://localhost:8083;
    }
}
